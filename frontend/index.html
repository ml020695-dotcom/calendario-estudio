<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calendario de estudio</title>
</head>
<body>
    <h1>Mis tareas</h1>

    <form id="form-tarea">
        <input type="text" id="titulo" placeholder="Titulo de la tarea" required>
        <input type="date" id="fecha" required>
        <input type="text" id="descripcion" placeholder="descripcion (opcional)">
        <button type="submit">Añadir tarea</button>
    </form>

    <p id="mensaje"></p>
    

    <ul id="lista-tareas"></ul>

    <script src="app.js"></script>
</body>
</html>
